version: 1
backend:
  phases:
    build:
      commands:
        # `npm install` et non `npm ci` : @aws-amplify/backend-cli tire des
        # dependances (@aws-cdk/toolkit-lib et sa cascade) que npm n'inscrit
        # pas dans le lockfile. `npm ci`, qui exige une correspondance exacte,
        # echoue donc systematiquement — regenerer le lockfile n'y change rien.
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*